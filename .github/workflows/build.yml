name: Build e Release

# A cada push para a branch main: compila, assina e publica uma Release.
# O app instalado no telemóvel deteta a Release nova e atualiza-se.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar assinatura e versão
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Faltam os Secrets SIGNING_KEY e SIGNING_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Ignora espaços/quebras de linha que possam ter entrado ao colar o Secret
          if ! printf '%s' "$SIGNING_KEY" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"; then
            echo "::error::O Secret SIGNING_KEY não é base64 válido. Cole de novo o conteúdo de keystore/SIGNING_KEY.txt."
            exit 1
          fi
          echo "Chave de assinatura: $(stat -c %s "$RUNNER_TEMP/release.jks") bytes"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          export SIGNING_PASSWORD="$(printf '%s' "$SIGNING_PASSWORD" | tr -d ' \r\n\t')"
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk BaixaVideos.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_CODE }}
          name: BaixaVídeos ${{ env.VERSION_CODE }}
          body: ${{ github.event.head_commit.message }}
          files: BaixaVideos.apk
